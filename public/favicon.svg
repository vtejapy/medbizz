<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <path
      id="shield"
      d="M50 5 L12 22 V50 C12 75 50 95 50 95 C50 95 88 75 88 50 V22 Z"
    />
    <clipPath id="clip">
      <use href="#shield" />
    </clipPath>
  </defs>

  <!-- Shield background: left white, right blue -->
  <use href="#shield" fill="#F4F6F8" />
  <g clip-path="url(#clip)">
    <rect x="50" y="0" width="50" height="100" fill="#214988" />
  </g>

  <!-- Shield border -->
  <use href="#shield" stroke="#214988" stroke-width="3" />

  <!-- ECG / pulse line -->
  <path
    d="M18 52 H32 L38 42 L46 68 L54 30 L62 60 H82"
    stroke="#C83232"
    stroke-width="6"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
